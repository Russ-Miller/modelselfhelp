# Soft, re-assignable vocabulary — a view over claims and capabilities,
# not a rigid single-parent taxonomy. `groups` and `contexts` both feed
# into `tags` on Capability and `tags`/`observed_on.task_type` on Claim.
# Expect to re-carve this at least twice; ids are permanent once merged,
# but what they mean and how content is tagged is free to evolve.

groups:
  # The map. Ten groups, each holding the capabilities it is the primary
  # home for; a capability names its `group` and may still carry other
  # groups as tags. The list of capabilities is open-ended by design: a
  # group with thin entries is a set of research briefs, not a finished
  # shelf. Six groups follow Russ's 2026-09-12 tree; four hold content the
  # tree did not cover.
  - id: reasoning
    label: Reasoning
    description: Multi-step reasoning, planning, decomposition, mathematical reasoning.
  - id: knowledge
    label: Knowledge
    description: Factual recall, domain knowledge, freshness, and stating false facts.
  - id: coding
    label: Coding
    description: Code generation, debugging, repository navigation, software architecture, secure code.
  - id: agentic
    label: Agentic
    description: Tool use, instruction following, long-horizon execution, self-correction, environment interaction.
  - id: context
    label: Context
    description: Long-context comprehension, retrieval utilization, noise tolerance, memory and state.
  - id: verification
    label: Verification
    description: Error detection, critique, and uncertainty calibration — the model checking work, its own or others'.
  - id: behavior
    label: Behavior
    description: Sycophancy, deception, faithfulness of explanations, diversity, and disparities across languages and cultures.
  - id: security
    label: Security
    description: Prompt injection and jailbreak robustness.
  - id: evaluation
    label: Evaluation
    description: Whether benchmarks and evaluation protocols measure what they claim.
  - id: perception
    label: Perception
    description: Audio, video, images and the physical world.

contexts:
  - id: general
    label: General
    description: Observed regardless of task; use only when the capability is not context-specific.
  - id: coding-agent
    label: Coding agent
    description: Editing, running and testing code in a repository over many steps.
  - id: chat-assistant
    label: Chat assistant
    description: Conversational help for a human, single or multi-turn.
  - id: rag-qa
    label: Retrieval-augmented QA
    description: Answering from supplied documents or search results.
  - id: data-analysis
    label: Data analysis
    description: Working with tables, numbers, and computed results.
  - id: math
    label: Math
    description: Word problems, symbolic math, and multi-step calculation.
  - id: multilingual
    label: Multilingual
    description: Tasks in languages other than English or across languages.
  - id: long-document
    label: Long document
    description: Inputs near the context limit; summarization, extraction, needle-in-haystack.
  - id: llm-as-judge
    label: LLM as judge
    description: A model scoring or ranking other models' outputs.
  - id: autonomous-agent
    label: Autonomous agent
    description: Long-horizon tasks with tools and minimal human oversight.
  - id: customer-support
    label: Customer support
    description: Policy-bound conversations with real users and account actions.
