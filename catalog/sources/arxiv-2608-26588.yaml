summary: >-
  Large Language Models (LLMs) generate register-transfer-level (RTL) code
  with rapidly improving functional correctness. Security of LLM-generated
  code, however, has been studied mainly for software, where flaws can still
  be patched after deployment. Insecure RTL offers no such remedy once taped
  out into silicon. We construct SECRTL-GEN, a multi-language
  resource-access security benchmark grounded in real SoC IP: 392 tasks over
  five CWE families and four HDLs (Verilog, SystemVerilog, VHDL, and
  Python), each with black-box functional and security testbenches.
