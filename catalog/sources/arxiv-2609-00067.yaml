summary: >-
  External text can override conflicting image evidence in multimodal large
  language models, a failure we call multimodal contextual sycophancy. We
  introduce a 998-case diagnostic that independently varies visual evidence,
  commonsense priors, and external text, and probe when this failure arises
  by moving the information boundary around a context-blind visual witness.
