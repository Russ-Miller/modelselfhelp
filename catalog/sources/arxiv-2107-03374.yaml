brief: >-
  New OpenAI paper: sampling a code model many times and filtering by tests
  beats trying to get 1 correct completion.


  The paper introduces Codex, a GPT model fine-tuned on public GitHub code,
  evaluated on Python program synthesis from docstrings. It also releases
  HumanEval, a hand-written benchmark that measures functional correctness by
  running unit tests rather than matching text. A separate production version
  of Codex powers GitHub Copilot.


  With 1 sample per problem, Codex solves 28.8% of HumanEval, against 0% for
  GPT-3 and 11.4% for GPT-J.


  That is the important part: repeated sampling changes the picture. With 100
  samples per problem, 70.2% of problems are solved, so the gap between a
  model that looks weak and one that looks strong is largely a search budget.


  The boundary is in the failure analysis. Codex struggles with docstrings
  describing long chains of operations and with binding operations to
  variables, and the evidence covers Python synthesis from docstrings only,
  not repository-scale or multi-language work.


  If you can execute and check candidate programs, budget for many samples
  instead of a better single completion.
