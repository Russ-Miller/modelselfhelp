summary: >-
  Models recursive self-improvement as a set of feedback loops on a directed
  graph, where net acceleration depends on the product of elasticities around
  each loop. Derives the condition for self-sustaining acceleration —
  progress continuing without growth in exogenous inputs — and calibrates it
  against existing data. Also publishes a wish list of measurements AI
  companies could feasibly share, which is the source of the diagram in
  Cheryl Wu's post on OpenAI's disclosure.
