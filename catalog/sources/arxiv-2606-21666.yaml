summary: "Dreaming and large language model hallucination are usually studied
  apart, one as biology and the other as engineering. We argue they are two
  expressions of a single computation: generative reconstruction from
  distributed memory under incomplete constraints. Neither the sleeping brain
  nor an autoregressive model retrieves stored records; both synthesize output
  by recombining learned representations, and both produce fluent, structured
  content that can depart from fact. We organize the two systems with a
  four-stage account, encoding, latent representation, generative
  reconstruction, and reality"
