summary: >-
  Current data science (DS) code generation benchmarks equate correctness
  with quality, overlooking execution time differences that span orders of
  magnitude between correct solutions. We introduce DSEffi-Bench, the first
  benchmark specifically targeting execution efficiency in LLM-generated DS
  code, comprising 1,000 instances across 10+ DS libraries with
  stress-testing harnesses and human-validated references. Evaluating 16
  models across 3 tiers, we find that correctness alone fails to
  characterize efficiency: GPT-5.4 leads in correctness (Pass, 66.9\%) but
