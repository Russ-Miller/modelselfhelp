id: arxiv-2512-22387
kind: paper
title: "AI-Generated Code Is Not Reproducible (Yet): An Empirical Study of Dependency Gaps in LLM-Based Coding Agents"
authors:
  - "Bhanu Prakash Vangala"
  - "Ali Adibifar"
  - "Ashish Gehani"
  - "Tanu Malik"
year: 2025
date: 2025-12-26
arxiv_id: "2512.22387"
url: https://arxiv.org/abs/2512.22387
tags: [coding-agent, dependencies, reproducibility]
summary: >-
  300 projects generated by Claude Code, OpenAI Codex and Gemini from 100
  standardized prompts across Python, JavaScript and Java, executed in a
  clean environment using only the dependencies the model declared. Only
  68.3% ran out of the box (Python 89.2%, Java 44.0%), and actual runtime
  dependencies averaged 13.5x the declared set. Introduces a three-layer
  claimed / working / runtime dependency framework.
ingested_at: 2026-09-04
