brief: >-
  Approval gates, cancellation, and timeouts in agent frameworks do not
  actually block side effects. On 6 widely used open-source frameworks, none
  upheld the barrier semantics their names and docs imply.


  Model-free differential probes isolated a recurring "sibling leak": an
  approval gate suspends its own branch while a sibling's effect runs during
  the pause, so rejection is defeated. This appeared in every framework
  shipping a pre-execution gate (5 of 6, spanning 4 execution models and 2
  language runtimes), alongside replay double-execution, cancellation orphans,
  and timeout zombies.


  The hazard is reachable by real models: frontier models emit the
  leak-triggering plan shape at rates up to 14%, and live models on unmodified
  frameworks leaked in 215 of 1,200 runs, with P(leak | emitted)=1.00. On
  naturalistic tau-bench episodes models serialize writes, so the everyday gap
  stays latent; injection induces the leak deterministically, and a
  13-incident public corpus corroborates the replay and cancellation failures.


  The proposed fix, SOUNDGATE, is an external Rust admission gate mediating
  every side effect. Its core is verified with Verus, TLA+/TLC to 7.5e7
  states, TLAPS, and Loom, plus differential conformance over 1.2e7 operations
  with zero divergences; it blocks every measured violation on all 6
  frameworks, with gated tau-bench episodes completing with zero refusals at
  ~1 ms per write and ~12k admissions per second.


  Evidence is probe-based and mechanical rather than statistical over diverse
  workloads; complete mediation holds only under the stated contract,
  discharged for network egress by 2 kernel-enforced routes, and closed-source
  frameworks were not tested. If you rely on approval gates as safety
  barriers, treat them as advisory until externally enforced.
