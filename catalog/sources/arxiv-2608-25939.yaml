summary: >-
  Large language models (LLMs) have shown promise for automated unit test
  generation, but existing evaluations largely rely on standalone settings
  and a narrow set of programming languages, overestimating real-world
  readiness. We introduce XREPOTEST, a multilingual repository-level
  benchmark for unit test generation spanning five underexplored languages:
  Rust, Go, Julia, PHP, and Ruby. XREPOTEST evaluates tests under realistic
  repository constraints using a containerized execution framework and
  multiple context augmentation strategies, including file-level, LSP-based,
  and retrieval-based context
