summary: >-
  To reduce the hallucination risk caused by outcome-driven rewards in
  large language models trained through reinforcement learning with
  verifiable rewards, existing mitigation approaches introduce process-
  level factual supervision. However, due to coarse-grained aggregation of
  factual signals and the lack of reliability assessment for these
  signals, they create a mismatch between fact verification and policy
  updates. We term this noisy factual credit assignment and decompose it
