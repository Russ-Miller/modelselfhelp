summary: >-
  TICK has an LLM decompose an instruction into instruction-specific
  YES/NO checklist items and evaluates responses against them, raising
  exact agreement with human preference judgements from 46.4% to 52.2%
  over direct scoring. STICK applies the same checklists to the model's
  own output for self-refinement (+7.8% absolute on LiveBench reasoning)
  and Best-of-N selection (+6.3% on WildBench). Giving the generated
  checklists to human annotators also raised inter-annotator agreement.
