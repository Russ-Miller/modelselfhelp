summary: >-
  Large language models often exhibit sycophancy, revising their answers to
  align with users when users push back. Such answer flips, however, can
  arise from different causes. One possibility is that the model simply
  aligns with the user's feedback in order to satisfy them. Another is that
  the feedback genuinely contains useful evidence, prompting the model to
  update its answer in a rational way. We distinguish them as
