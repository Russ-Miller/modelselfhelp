  specialized terminology often makes them difficult for patients to
  interpret. As a result, many patients turn to publicly available Large
  Language Models (LLMs) to help explain their reports, despite
  well-documented risks of factual inaccuracies and hallucinations.
  Automated lay-summary generation has emerged as a promising alternative,
