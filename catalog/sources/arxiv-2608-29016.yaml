summary: >-
  Large language models (LLMs) have demonstrated considerable promise in
  program generation for small-scale and conventional application
  development; however, they remain limited when applied to complex,
  domain-specific tasks such as medical image processing. General-purpose
  models lack explicit domain knowledge and robust validation mechanisms to
  ensure correctness, often requiring substantial human intervention to
  produce reliable processing pipelines. To address these limitations, we
  propose AutoMedImg, a multi-agent framework for fully automated medical
  image processing code generation. Auto
