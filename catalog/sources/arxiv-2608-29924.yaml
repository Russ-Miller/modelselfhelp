summary: >-
  Large Vision-Language Models (LVLMs) are prone to hallucinations: they
  fluently describe objects, attributes, and scenes that are not in the
  image. We connect part of this failure to a measurable property of their
  representations, feature instability, where mild semantics-preserving
  perturbations of the input cause large changes in the learned embeddings;
  hallucination rates rise together with this variability. Existing
  stability-motivated remedies are explicit, in the sense that they
