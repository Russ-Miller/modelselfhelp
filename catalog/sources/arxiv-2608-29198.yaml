summary: >-
  As Large Language Models (LLMs) increasingly encourage users to disclose
  personal profiles for tailored assistance, measuring their political
  alignment becomes increasingly important. However, many existing
  benchmarks for assessing political behavior rely on closed-ended questions
  and do not fully capture how a model's stance may adapt to user-provided
  context during interaction. We introduce a framework that disentangles two
  distinct triggers of political sycophancy: opinion (aligning with explicit
  narratives) and identity (stereotyping based on demographic labels). Using
