summary: >-
  Fine-tunes backbone LMs on agent trajectories for question answering with
  a search API. Llama2-7B fine-tuned on 500 GPT-4-generated trajectories
  gained 77% on HotpotQA. FireAct mixes trajectories from multiple tasks
  and prompting methods, and finds more diverse fine-tuning data improves
  agents further.
