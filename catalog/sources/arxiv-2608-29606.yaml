  everything a user or organization has said and stored, yet most memory
  systems commit to a single organizing structure (a fact store, a vector
  index, or a knowledge graph) and inherit its blind spots. We present Agent
  Zero Memory, a provenance-aware long-term memory system that distils a
  user's conversations, files, and connected sources into three parallel
