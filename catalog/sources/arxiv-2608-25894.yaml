summary: >-
  Large language models (LLMs) frequently produce confident yet factually
  incorrect responses when user inputs contain misleading premises, a
  phenomenon we attribute to fact perturbations in the input. Existing
  approaches to hallucination mitigation typically assume reliable user
  inputs, overlooking how such factual errors can actively mislead model
  reasoning. To address this vulnerability, we propose DEDUCE, a three-
  stage framework that transforms LLMs from passive responders into
  proactive error correctors. DEDUCE operates in three stages: (1) detect
