id: context-hygiene
label: Keeping its own context clean
summary: Agents fill their working context with re-read files, restated notes, and excess documentation until quality degrades.
description: >-
  Over a long task, a capable agent keeps only relevant material in its
  working context, summarizes what it has learned instead of re-reading it,
  and writes notes and documentation in proportion to their value.
strong_performance_looks_like: >-
  Keeps only what is currently relevant in its working context, summarizes instead of re-reading, and writes documentation in proportion to its value.
weak_performance_looks_like: >-
  Re-reads the same file several times; restates its plan every turn; writes
  long progress notes or comments nobody asked for; and as the context
  fills, starts forgetting earlier constraints and repeating earlier mistakes.
group: context
parent: long-context-degradation
aliases: [context management, over-documentation, context bloat]
contexts: [coding-agent, autonomous-agent]
evidence:
  - paper: arxiv-2402-14848
    strength: controlled
    note: >-
      Adding irrelevant tokens alone degrades reasoning, which is the mechanism
      by which a bloated context hurts an agent.
  - paper: arxiv-2310-08560
    strength: controlled
    note: >-
      Managing context explicitly, paging information in and out of a bounded
      window, sustains performance on tasks that exceed the window.
techniques: [hierarchical-memory]
related: [long-context-degradation, long-term-memory]
status: proposed
submitted_by: human:Russ-Miller
