id: long-context-degradation
label: "Losing information in long inputs"
summary: "Accuracy drops as inputs grow and is worst for information placed in the middle of the context."
description: >-
  A capable model uses every part of a long input equally well, up to its advertised context length, and its reasoning does not degrade as irrelevant material is added.
