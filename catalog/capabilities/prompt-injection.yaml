id: prompt-injection
label: Following instructions hidden in data
summary: Models treat instructions found in retrieved documents, tool outputs, or web pages as if they came from the user.
description: >-
  A capable model treats content it reads through tools as data. It follows
  only instructions from the user and the system, and it flags text that
  tries to redirect it rather than acting on it.
strong_performance_looks_like: >-
  Treats everything read through a tool as data, never as an instruction, and flags content that tries to redirect it.
weak_performance_looks_like: >-
  Executes an instruction embedded in a web page or email it was asked to
  summarize; leaks the system prompt or user data when a document tells it
  to; or changes task because a tool result said to.
group: security
aliases: [indirect prompt injection, jailbreak via content]
contexts: [rag-qa, autonomous-agent, coding-agent, customer-support]
evidence:
  - paper: arxiv-2302-12173
    strength: controlled
    note: >-
      Demonstrates that instructions planted in retrieved content can hijack
      real LLM-integrated applications for data theft and manipulation.
  - paper: arxiv-2211-09527
    strength: controlled
    note: >-
      Simple goal-hijacking and prompt-leaking attacks succeed against
      production models with short adversarial strings.
  - paper: arxiv-2402-06363
    strength: controlled
    note: >-
      Separating prompt and data with reserved delimiters and fine-tuning on
      that structure blocks most injections at little cost to utility.
  - paper: arxiv-2404-13208
    strength: controlled
    note: >-
      Training models to rank system, user, and tool instructions by privilege
      improves robustness to injections in tool outputs.
techniques: [structured-prompt-separation]
related: [secure-coding, goal-conflict-safety]
status: accepted
submitted_by: human:Russ-Miller
