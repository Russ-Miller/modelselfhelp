    note: >-
      Asking the model to review and revise its own reasoning answers, with no
      external feedback, lowered accuracy on GSM8K and CommonSenseQA.
notes: >-
  The finding is specific to intrinsic self-correction. With an oracle or a
  verifier the same model does improve, which is why the mitigation is
  external feedback rather than more self-review.
