id: judge-position-bias
label: Biased when judging other outputs
summary: A model used as a judge favors whichever answer is shown first, longer answers, and its own outputs.
description: >-
  When scoring or ranking candidate answers, a capable judge gives the same
  verdict regardless of the order of candidates, their length, or which
  model produced them, and agrees with careful human raters.
failure_looks_like: >-
  Flips its verdict when the two candidates are swapped; prefers the longer
  answer even when it adds nothing; and rates outputs from its own model
  family higher.
group: evaluation
aliases: [LLM-as-judge bias, position bias, verbosity bias, self-enhancement bias]
contexts: [llm-as-judge]
evidence:
  - paper: arxiv-2306-05685
    stance: supports
    strength: controlled
    note: >-
      Identifies position, verbosity, and self-enhancement biases in strong
      judges, while also showing high agreement with humans once mitigated.
  - paper: arxiv-2305-17926
    stance: supports
    strength: controlled
    note: >-
      Swapping candidate order alone can flip the judge's preference, so an
      evaluator can be gamed by ordering.
techniques: [position-swap-judging]
related: [sycophancy]
status: accepted
submitted_by: human:Russ-Miller
