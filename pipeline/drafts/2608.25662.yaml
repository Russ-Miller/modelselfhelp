falsifier: Bootstrap resampling of the same test set yields narrow rank
  intervals (e.g. top systems confined to one or two positions) despite the
  low absolute scores.
evidence_note: "Measured: 25,000-sample bootstrap rank distributions per
  language and metric. Top English system had mean rank 2.9 with a 95%
  interval spanning ranks 1-10; intervals up to 15 positions in EN, ~5-6 in
  ZH. Rank correlations across data-construction partitions were also below 1,
  lowest for randomly sampled examples. Single task, single dataset; the
  inverse relation between score level and rank stability is observed, not
  isolated by design."
