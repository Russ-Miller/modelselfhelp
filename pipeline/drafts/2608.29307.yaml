arxiv_id: "2608.29307"
title: Detecting and Repairing Hallucinations in Retrieval-Augmented Generation
url: https://arxiv.org/abs/2608.29307
drafted_at: 2026-09-09
drafted_from: abstract
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: "In retrieval-augmented answers, splitting an answer into claims,
  checking each against the retrieved source, and then acting on the flagged
  claims reduces the share of answers judged to contain unsupported content —
  but the strategies trade grounding against preservation: deleting
  unsupported claims reduces unsupported content most while retaining the
  least original text, and rewriting retains the most while reducing least."
kind: mechanism
backing_strength: single-paper
scope_condition: RAG answers on the RAGTruth benchmark with hand-annotated
  unsupported passages; 916 repaired answers judged by three LLM judges from
  different families; no human usefulness ratings.
technique: atomic-fact-checking
proposed_technique: claim-level repair of unsupported content (delete, replace
  with source, rewrite)
stance_on_existing: supports
related_claim_id: decomposing-long-answers-into-atomic-facts-checking-each
stance_reason: The paper applies atomic-claim verification and shows the
  flagged claims can be acted on, extending fact-by-fact checking from
  detection to repair.
falsifier: A repair pipeline where deletion does not reduce judged unsupported
  content more than rewriting, or where all strategies preserve text equally,
  would break the trade-off ordering; judges disagreeing on the ordering would
  too.
evidence_note: Measured on one benchmark with three LLM judges agreeing on
  ordering; retention percentages reported (64.3% deletion, 80.1% rewriting).
  Does not measure whether repaired answers remain useful to readers, and
  83.5% of clean answers were also edited, so precision of the flagging step
  is a live concern.
confidence: medium
