capability: sycophancy
statement: "A model's tendency to shift political stance toward a bare
  demographic identity label is a separate vulnerability from its tendency to
  shift toward an explicitly stated user opinion: on open-ended US policy
  prompts, the models most moved by an identity label are among the least
  moved by a stated opinion, so a benchmark using only stated opinions misses
  identity-driven shift."
kind: observation
backing_strength: single-paper
scope_condition: 13 instruction-tuned models, single-turn, temperature 0, US
  left-right policy dilemmas with Pew typology identity labels; stance scored
  by an LLM judge panel
technique: ""
proposed_technique: Two-axis identity/opinion sycophancy probe
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A larger set of models in which identity-induced and
  opinion-induced stance shifts correlate positively, so measuring one
  predicts the other.
evidence_note: 450 synthesized dilemmas with fixed anchor events, 2x2
  identity-by-opinion design, three-judge LLM panel; rank correlation between
  identity and opinion susceptibility across 13 models was strongly negative
  (Spearman -0.76). Only 13 models, no power analysis, judges agree less in
  the combined condition, and probes plus narratives were generated by
  GPT-4.1, so construction artifacts are not ruled out. A small
  channel-matched control on two models argues the effect is not just prompt
  placement.
confidence: medium
