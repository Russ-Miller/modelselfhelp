arxiv_id: "2609.00067"
title: Do Multimodal LLMs See Before They Read? Diagnosing Contextual Sycophancy
url: https://arxiv.org/abs/2609.00067
drafted_at: 2026-09-09
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: sycophancy
statement: When a multimodal model is given external text that contradicts the
  image, making it commit to a description of the image before the text is
  admitted, then reconciling the two in a second call, recovers accuracy the
  single-prompt setup loses — but the benefit of withholding the text from the
  first call is model- and text-source dependent, and on some models
  context-preserving prompting is still better.
kind: mechanism
backing_strength: single-paper
scope_condition: Image-question pairs where the visible scene conflicts with
  commonsense priors and a single false sentence supports the prior; six
  frontier multimodal models; false text generated by one model, with a
  200-case regeneration by another that changes the ordering.
technique: ""
proposed_technique: Context-blind visual witness then arbitration
stance_on_existing: supports
related_claim_id: withholding-the-users-opinion-is-the-no-training-alternative
stance_reason: Extends the same lever — keep the biasing text out of context
  when the answer is formed — to conflicting external text in multimodal
  input, while showing the withholding step alone is not what carries the
  gain.
falsifier: A replication where the staged witness-then-arbiter pipeline gives
  no gain over a prompt-matched single-call condition on conflicting
  image-text cases, or where withholding the text from the witness helps
  uniformly across models and text generators.
evidence_note: 998-case constructed diagnostic, 499 abnormal images with false
  text; six models. Arbitration over the isolated witness gains 19.7-44.1
  points with paired 95% CIs excluding zero. But Kimi-K2.5 does best under a
  plain visual-supremacy prompt and Qwen3-Instruct under joint conditioning;
  on the GPT-4o-regenerated 100-case subset joint is best for three of four
  models. Ground truth is the image answer by construction, and grading is by
  a GPT-4o-mini judge with partial human audit. Adversarial by design, not a
  prevalence estimate.
confidence: medium
