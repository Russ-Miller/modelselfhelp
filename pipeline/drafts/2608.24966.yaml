arxiv_id: "2608.24966"
title: Targeting the Attention Heads Behind Object Hallucination in LLaVA
url: https://arxiv.org/abs/2608.24966
drafted_at: 2026-09-09
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: In LLaVA-1.5-7B captioning, restricting a LoRA adapter to attention
  heads picked by a hallucination diagnosis (attention-to-image drop around
  hallucinated object words, then ablation screening) reduces object
  hallucination, while an identically trained layer-matched random-head
  adapter does not — so the selection, not the added adapter capacity, carries
  the effect.
kind: mechanism
backing_strength: single-paper
scope_condition: One model (LLaVA-1.5-7B), one captioning prompt, COCO val2014
  images, CHAIR scoring; 32 selected heads across 19 layers; control split of
  200 images. Gains come with shorter captions and lower object recall (0.78
  to 0.70).
technique: ""
proposed_technique: Diagnosis-selected head-restricted adapter plus grounding-gated decoding
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A random-head or all-head LoRA trained with the same DPO pairs and
  matched length reaching the same CHAIR reduction, or the selected heads
  failing to transfer to other VLMs/prompts.
evidence_note: Measured on 400 held-out COCO images (CHAIRs 0.370 to 0.230,
  CHAIRi 0.156 to 0.096, paired sign-flip p<0.001) plus a 200-image control
  split where random-head LoRA gave CHAIRs 0.400 vs 0.100 for selected heads.
  Fixed-budget runs (64/80/128 tokens) rule out pure truncation, but no fully
  length-matched or all-head-LoRA baseline, and recall falls, so
  precision-coverage tradeoff is not isolated.
confidence: medium
