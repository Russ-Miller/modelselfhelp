capability: hallucination
statement: For black-box hallucination detection using only sampled responses
  and token log-probabilities, semantic-entropy signals go to zero whenever
  the samples collapse into one semantic cluster — which happens for a large
  share of hallucinated queries, up to nearly all of them on tasks with
  confusable entities and figures — while token-level uncertainty still
  separates many of those cases, so the two signals fail on different queries
  and combining them detects more than either alone.
kind: mechanism
backing_strength: single-paper
scope_condition: Black-box API access exposing text and token
  log-probabilities, no trusted reference document; measured on seven
  QA/extraction/summary benchmarks with four models. Supervised combination
  requires labelled target-domain data; neither signal catches hallucinations
  that are both semantically consistent and generated with high token
  confidence.
technique: ""
proposed_technique: Stacked semantic-plus-token hallucination detector
stance_on_existing: neither
