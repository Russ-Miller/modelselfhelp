falsifier: Show that on single-semantic-cluster hallucinated queries
  token-uncertainty features give no separation above chance, or that a
  combined detector never beats the better single signal across datasets and
  models.
evidence_note: "Measured: single-cluster rate among hallucinated queries
  ranged 39% (AmbigQA) to 99% (Financial Summaries); median TopK uncertainty
  higher for hallucinated single-cluster queries on six of seven datasets,
  though 21-56% of them fell below the non-hallucinated median. Stacked led or
  tied in 11 of 26 model-dataset comparisons and was within 0.05 AUROC of the
  best in 20 of 26. Authors note the leading method's confidence interval
  overlaps a competitor on every dataset, so rankings among methods are not
  conclusive; the complementarity analysis is stronger than the ranking."
