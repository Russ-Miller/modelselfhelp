arxiv_id: "2609.00759"
title: "Compile, Don't Memorize: A Context Compilation Architecture (CCA) for
  In-Context Learning"
url: https://arxiv.org/abs/2609.00759
drafted_at: 2026-09-07
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-context-degradation
statement: On rubric-graded long-context tasks, most of the gain from a
  context-compilation harness comes from extracting the context's rules, exact
  terms and output spec into an explicit checklist placed in the prompt, not
  from the executable verifiers built on top of it — and the gain appears only
  on rule-dense tasks and on models with enough capacity, disappearing or
  reversing on open-ended tasks and on a small-activation model.
kind: mechanism
backing_strength: single-paper
scope_condition: Long novel contexts (median 20K characters) graded against
  5-20 all-or-nothing rubric criteria; four large open models; gains
  concentrated in rule/procedure-heavy categories and absent on open-ended
  creative and single-context tasks.
technique: checklist-decomposition
proposed_technique: Compile context into a typed rule IR and inject it as a checklist
stance_on_existing: supports
related_claim_id: generated-checklists-make-instruction-requirements-individually-checkable
stance_reason: The ablation shows the checklist injection of extracted
  constraints is the largest single contributor (-3.07pp when removed of a
  +6.00pp total), with verifier execution alone worth about half a point.
falsifier: An ablation on other models or benchmarks where removing the
  verifier/correction loop costs more pass rate than removing the checklist
  injection, or where the checklist gives similar gains on open-ended tasks.
evidence_note: "Ablation on 1,899 CL-bench tasks, one model (Kimi K2.5),
  temperature 0, single GPT-5.1 judge: full pipeline 21.40% vs vanilla 15.40%;
  removing checklist injection -3.07pp, removing correction loop -1.28pp,
  verifier execution alone ~0.53pp. Component isolation not repeated on the
  other three models. LongBench-v2 probe shows aggregate accuracy below
  vanilla, supporting the scope limit. Absolute pass rates are low throughout,
  so deltas are on a small base."
confidence: low
