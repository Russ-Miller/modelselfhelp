arxiv_id: "2608.27750"
title: "The Calls are Coming from Inside the Model: Investigating Probe-based
  Detection of Tool-Calling Errors in LLMs"
url: https://arxiv.org/abs/2608.27750
drafted_at: 2026-09-09
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: tool-use
statement: A linear probe on a tool-calling model's hidden state at the last
  generated token detects incorrect tool-calls — including
  wrong-but-well-typed argument values that parsers and logs do not catch —
  and works better on larger models and at middle-to-late layers than at the
  final layer.
kind: observation
backing_strength: single-paper
scope_condition: 18 open tool-calling LLMs from 1B to 70B parameters, on BFCL
  simple_python/java/javascript and multiple splits (750 examples per model),
  models with above 80% tool-calling accuracy; all error types pooled as the
  positive class; 70/30 stratified split.
technique: ""
proposed_technique: hidden-state probe for tool-call errors
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Probes trained this way scoring near chance AUROC on held-out
  tool-calls, or final-layer probes matching or beating middle-layer probes,
  or no size advantage once tool-calling accuracy is controlled.
evidence_note: "Measured AUROC and AUPR per layer per model; most models above
  0.80 AUROC, ~0.06 AUROC gain for 70B over ~8B. Transfer across disjoint
  error-type splits above 0.75 AUROC suggests a general correctness feature
  rather than error-specific cues. Confound with capability partly addressed:
  R^2 within the ~8B group is 0.005 and two large but lower-accuracy models
  still probe well. Single benchmark, short simple-call splits,
  in-distribution test split — no deployment or distribution-shift test."
confidence: medium
