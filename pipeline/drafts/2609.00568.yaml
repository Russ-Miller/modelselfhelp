arxiv_id: "2609.00568"
title: "WiseSpec: Requirements-Driven Agents for Code Generation"
url: https://arxiv.org/abs/2609.00568
drafted_at: 2026-09-09
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: code-generation
statement: On repository-level issue-fixing tasks (SWE-bench
  Lite/Verified/Pro), spending effort upstream — expanding the issue text into
  a structured requirement spec from retrieved repo context, then testing and
  refining that spec via generated code and tests — raises resolve rate over
  agents that consume the raw issue description, and raises the share of
  patches that even apply cleanly by a larger margin than it raises
  correctness.
kind: observation
backing_strength: single-paper
scope_condition: 100 sampled instances per benchmark, DeepSeek-V3.2 and
  Qwen-Plus baselines against Agentless, Trae-agent and Claude Code; a single
  added run with Claude-Opus-4.8 on SWE-bench-Pro gave a much smaller gain
  (53% to 56%).
technique: ""
proposed_technique: requirements-refinement-before-coding
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched comparison where adding the requirement-construction and
  refinement stage leaves %Resolved unchanged or lower relative to the same
  agent given the raw issue text, or where the patch-application gain does not
  exceed the correctness gain.
evidence_note: Measured across 6 settings (3 benchmarks x 2 models) with a
  Wilcoxon signed-rank test; %Resolved gains 2-29%, %Applied gains 11-63%, so
  the applied-vs-resolved asymmetry is visible in the table. Compute per
  instance is not reported, so the comparison does not isolate extra inference
  budget from the requirements idea, and the stronger-model check is one
  benchmark with a 3-point gap.
confidence: low
