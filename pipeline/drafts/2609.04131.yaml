statement: For streaming video question answering with a frozen video-LLM,
  appending retrieved historical frames as extra visual context helps less
  than optimizing a small set of latent memory tokens at test time and then
  dropping the retrieved tokens before decoding; the gain is largest on
  questions requiring backward tracing over past history.
