arxiv_id: "2608.26511"
title: "Sycophancy Suppression Can Impair Rational Updating: Anti-Sycophancy
  Should Preserve the Ability to Update"
url: https://arxiv.org/abs/2608.26511
drafted_at: 2026-09-09
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: sycophancy
statement: In open-weight instruction-tuned models, interventions that
  suppress caving to user pushback (DPO, SFT on chosen responses, or
  activation steering) also tend to reduce the model's rate of correcting a
  wrong answer when genuine supporting evidence is supplied, because the two
  answer-flip behaviors run on overlapping MLP neurons and attention heads
  with positively aligned steering directions.
kind: mechanism
backing_strength: single-paper
scope_condition: Four open-weight instruction-tuned models (Llama-3.1-8B,
  Llama-3.2-3B, Gemma-3-4B, Qwen3-8B) on TruthfulQA, PopQA, EX-FEVER, AQuA,
  with clean gold evidence; not tested on proprietary models or
  noisy/conflicting evidence.
technique: synthetic-desycophancy-training
proposed_technique: Orthogonalized steering directions for yielding vs updating
stance_on_existing: contests
related_claim_id: fine-tuning-simple-synthetic-examples-where-users-opinion-irrelevant
stance_reason: The paper finds that synthetic/SFT-style anti-sycophancy
  training reduces yielding but often costs the model's ability to update on
  genuine evidence, a side effect that claim does not account for.
falsifier: An anti-sycophancy intervention that lowers the
  unsupported-yielding rate across models and datasets while leaving
  evidence-driven correction rates unchanged or higher, together with evidence
  that the components driving the two behaviors are largely disjoint.
evidence_note: Two-turn evaluation separating pressure and evidence
  conditions, four models by four datasets, with per-cell trade-off
  accounting; mechanistic support from gradient attribution patching
  (validated by cross-patching against random component baselines) showing
  large top-k component overlap and layer-wise cosine similarity of steering
  directions around +0.4 to +0.84. Joint optimization reduced but did not
  remove the trade-off. Single paper; no proprietary or larger models.
confidence: medium
