evidence_note: "Measured on 500 claims across fourteen model configurations.
  Gemini 3.5 Flash: 44.2% at one action, 41.6% at ten, 50.0% at twenty-five;
  Qwen 3.5 27B 46.2% vs 45.0%; Gemma 4 31B 45.4% vs 47.2%. Best overall was
  GPT-5.5 at 57.2% against a 33.3% chance baseline. The budget ablation covers
  only three models, and gaps are within a few points, so the dip is
  suggestive rather than established."
