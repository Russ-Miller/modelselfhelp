statement: When VLM agents must verify claims against interactive
  visualizations where no claim is answerable from the initial viewport,
  giving them an interaction budget of ten actions does not reliably beat
  answering immediately from the first screenshot — some models score slightly
  lower with interaction — because partial, unplanned exploration leaves the
  model with enough evidence to abandon its prior but not enough to replace
  it.
