arxiv_id: "2608.29352"
title: Cross-Relational Preference Learning for Better LLM Instruction Following
url: https://arxiv.org/abs/2608.29352
drafted_at: 2026-09-09
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: procedure-following
statement: When building preference data to teach 7-8B instruct models to
  follow multi-constraint instructions, perturbing each atomic constraint in
  several directions so the perturbed instruction's valid-response set
  contains, partly overlaps, or is disjoint from the original's — and pairing
  responses drawn from each sub-region — raises constraint adherence more than
  rejection sampling or teacher-correction pairs, and the gain holds on
  perturbed instruction variants the baselines barely improve on.
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-7B-Instruct and Llama-3.1-8B-Instruct,
  DPO/KTO/online-DPO, 12k pairs, constraints that are checkable by executable
  code; tested on IFEval, IFBench, a perturbed set built by the authors, and
  FollowBench.
technique: ""
proposed_technique: Cross-relational preference pairs over perturbed constraints
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Matching the same 12k pair budget with disjoint-only or random
  perturbations yields the same constraint accuracy, or the advantage
  disappears on a held-out benchmark not built with the same perturbation
  procedure.
evidence_note: Two backbones, three optimization methods, four test sets,
  fixed 12k training size, with ablations removing each relationship type and
  each pair region — each removal lowers accuracy. One of the four test sets
  (Perturbed-IF) is generated by the authors' own perturbation method, which
  favors the method; the data-scaling curve and the fixed budget do argue the
  gain is not just more data. Single group, no independent replication.
confidence: medium
