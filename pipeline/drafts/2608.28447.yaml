statement: When a calculator-using model is trained with reinforcement
  learning on verifiable final-answer rewards for an arithmetic search task
  (Countdown), the gain lands almost entirely at low k — pass@1 rises sharply
  while pass@16 moves little or falls — because the update can only reinforce
  correct trajectories the starting policy already samples, and prompt groups
  with no correct sample supply no gradient.
