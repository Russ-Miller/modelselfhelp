falsifier: An outcome-only RL run on the same setup that raises pass@16 by as
  much as pass@1, or that turns prompts with zero correct samples in the base
  policy into solved prompts without added search or process supervision.
evidence_note: "Measured on a fresh 1,024-problem held-out Countdown set (plus
  a noisy 50-problem public split) with 95% bootstrap intervals. Tool-RLOO
  went 35.8 to 56.6 pass@1 while pass@16 went 73.7 to 74.0; Tool-RLOO++
  reduced pass@16 below Tool-RLOO. Correctness-distribution analysis over 16
  samples per prompt shows mass shifting toward fully-correct sets and
  zero-correct prompts persisting. Tool-DAPO is a partial exception: it
  improved pass@16 modestly and cut the zero-correct fraction. One task, one
  base policy, so the mechanism claim rests on the distribution analysis plus
  cited prior RLVR work rather than on independent replication."
