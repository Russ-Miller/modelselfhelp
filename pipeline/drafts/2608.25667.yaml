statement: "For filtering unsupported LLM-generated vulnerability reports in
  security triage, statistical machine-text detectors are the wrong
  instrument: they score provenance, not correctness, and human-written
  security reports are template-driven and low-perplexity, so they trip the
  same signal that flags machine text."
