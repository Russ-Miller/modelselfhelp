falsifier: A statistical AI-text detector applied to a mixed corpus of human
  and LLM bug bounty reports achieves both low false-positive rates on human
  reports and high separation of unsupported claims from grounded ones.
evidence_note: Survey. Argued from the low lexical diversity of security
  report templates plus a cited theoretical result that detector AUC converges
  to chance as model output distributions approach human writing. No new
  measurement on security reports is reported here; the causal step from
