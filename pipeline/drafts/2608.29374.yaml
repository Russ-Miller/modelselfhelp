arxiv_id: "2608.29374"
title: "Think, Look, and Revise: Inconsistency-Aware Visual Self-Correction in
  MLLMs"
url: https://arxiv.org/abs/2608.29374
drafted_at: 2026-09-09
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: self-repair
statement: Tool-augmented multimodal models trained only on how to call vision
  tools accept tool outputs uncritically; adding supervised trajectories where
  tool evidence is checked against the image and re-queried, plus a reward for
  correction that reaches a correct answer, raises accuracy on
  perception-heavy benchmarks (counting, depth, spatial relations) in 3B and
  7B Qwen2.5-VL, while slightly lowering it on knowledge-heavy ones.
kind: mechanism
backing_strength: single-paper
scope_condition: Qwen2.5-VL 3B and 7B backbones with a fixed suite of vision
  tools (detection, zoom, edge, depth); training trajectories synthesized by
  Gemini-2.5-Pro; gains do not transfer to MMMU/MathVista-style abstract
  tasks.
technique: external-feedback-repair
proposed_technique: verification-supervised tool self-correction training
stance_on_existing: supports
related_claim_id: external-feedback-repair-works-only-with-real-grounding
stance_reason: The correction loop works because the model checks tool output
  against the image itself, an external perceptual signal, and the paper notes
  recovery fails when that signal is ambiguous or the tool fails outright.
falsifier: An ablation showing the curated verification trajectories and
  correction reward give no gain over standard tool-use SFT plus accuracy-only
  GRPO on the same perception benchmarks and backbone.
evidence_note: Measured on CountBench, CVBench, BLINK, BLINK-HARD, MMVP,
  MMSTAR and others against Qwen2.5-VL-Instruct, SFT, SFT-GRPO, and
  tool-augmented baselines (ReVPT, Thyme, CodeDance), with an ablation
  separating cold-start data, correction reward and grounding reward. Single
  group, margins over prior SoTA are small and mixed per benchmark; the
  trajectory data comes from a stronger proprietary model, so distillation is
  not isolated from the verification mechanism.
confidence: medium
