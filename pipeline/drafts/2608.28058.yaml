arxiv_id: "2608.28058"
title: Dynamic Alignment Compensation for Hallucination Mitigation in Large
  Vision-Language Models
url: https://arxiv.org/abs/2608.28058
drafted_at: 2026-09-09
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: In open-source vision-language models (LLaVA-1.5, Qwen-VL-Chat,
  Qwen2.5-VL, LLaVA-NeXT), a training-free decoding intervention that detects
  large layer-to-layer and step-to-step shifts in hidden states and nudges the
  diverging states back toward their prior value lowers object-hallucination
  rates, but the lower rate comes with fewer objects mentioned and shorter
  outputs.
kind: observation
backing_strength: single-paper
scope_condition: Open-source image-input LVLMs at 3B-7B scale, standard
  hallucination benchmarks (POPE, CHAIR, HallusionBench); not tested on closed
  models, video, or multi-image input.
technique: ""
proposed_technique: Hidden-state divergence compensation at decoding time
stance_on_existing: supports
related_claim_id: training-free-inference-time-hallucination-mitigation-7b-vision-language-models-reported-gains
stance_reason: On CHAIR the method cuts sentence- and instance-level
  hallucination rates while recall and average response length both fall, the
  same coupling of lower hallucination with reduced informativeness.
falsifier: A replication where the same compensation leaves CHAIR recall and
  response length unchanged while hallucination rates still fall, or where
  hallucination rates do not fall at all on a held-out backbone.
evidence_note: Measured on nine benchmarks across six backbones against
  vanilla decoding and training-free baselines (VCD, ICD, MemVR, OPERA). CHAIR
  shows Cs 47.6->28.2 and Ci 13.3->7.3 on LLaVA-1.5 with recall 80.6->72.0 and
  length 99.7->88.9. Authors report a length-normalized analysis in an
  appendix not included here, so the informativeness confound is claimed to be
  addressed but not verifiable from the given text. Single group, fixed
  thresholds, no seed variance reported.
confidence: medium
