title: "ECLIPSE: Self-Evolving Stealthy Prompt Injection Attack against
  Long-Horizon Agentic Systems"
url: https://arxiv.org/abs/2608.30441
drafted_at: 2026-09-09
drafted_from: full-text
model: claude-opus-5
