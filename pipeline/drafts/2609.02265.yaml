stance_reason: ""
falsifier: A memory policy reading only recency and provenance that matches or
  beats a history-conditioned authenticity gate on both genuine-update
  adherence and poisoning resistance, including on same-origin (user-pasted)
  contamination.
evidence_note: "Argued as a decision-theoretic lower bound plus measured on
  480 held-out synthetic episodes from 96 users: provenance-only 20.0%
  poisoning / 74.1% adherence, recency RAG 51.6% / 85.7%, proposed gate 11.5%
  / 83.5%; provenance-only collapses to 43.6% on same-origin contamination vs
  17.5%. A supervision-matched Transformer baseline reaches 69.3% win / 15.9%
  poisoning, so most of the gain is supervised temporal tracking rather than
  the specific architecture. Benchmark is generated by the authors; partial
  transfer shown zero-shot on an external benchmark and 40-user replay, but
  the replayed attacks are author-constructed. Under an adaptive attacker
  poisoning rises to 24.7%, not separated from provenance-only's 22.1%."
confidence: medium
