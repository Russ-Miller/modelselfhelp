capability: long-term-memory
statement: For persistent-memory agents, any memory-write rule that decides
  using only recency and provenance is stuck on a single tradeoff — accepting
  more genuine preference updates means admitting more poisoned ones — because
  an adversary who can launder a claim through the user's own channel matches
  the statistics a genuine revision produces; conditioning the write decision
  on the inferred authenticity of the claim given the interaction history
  moves both axes at once.
kind: mechanism
backing_strength: single-paper
scope_condition: Personalized agents with persistent cross-session memory
  where retrieved documents, shared files, or tool outputs can be written into
  the user model; holds against a fixed attacker, and the advantage over a
  provenance filter is not separated under an attacker adapting against
  released weights.
technique: ""
proposed_technique: Latent-authenticity gate for memory writes
stance_on_existing: neither
