capability: fact-verification
statement: When an LLM agent must reconcile user-supplied identity credentials
  against database records before a sensitive read or write, frontier and open
  models frequently skip the cross-field consistency check and act anyway, and
  the failure rate barely moves whether the request is simple or has several
  parallel sub-requests and whether the forged field is visually
  near-identical to the true one or completely unrelated.
kind: observation
backing_strength: single-paper
scope_condition: Multi-turn simulated retail customer-service tasks with
  stateful tools and a domain policy requiring credential verification; nine
  models, one trial per task, greedy decoding, policies that do not announce a
  conflict is present.
technique: ""
proposed_technique: conflict-injection agent benchmark
