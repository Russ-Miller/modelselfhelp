stance_reason: ""
falsifier: Showing that detection and clarification rates rise substantially
  as the forged credential becomes more dissimilar from the true one, or as
  the number of parallel requests drops, under the same harness.
evidence_note: Measured on 93 retail tasks within a 238-task benchmark, scored
  by an assertion model plus human trajectory verification; best retail score
  was 0.7312 (Claude Haiku 4.5) with several models far lower. The complexity
  and similarity insensitivity is reported qualitatively without per-condition
  numbers, so that part is argued more than quantified. Single trial per task
  limits variance estimates.
confidence: low
