falsifier: Replication on the same backbones showing that hallucination
  reductions are matched by drops in object coverage or in VQA-v2/TextVQA
  accuracy, or that a plain generation-loss fine-tune on the same 2K data
  gives the same hallucination reduction without the stabilization objectives.
evidence_note: "Measured on three backbones against re-run base models and
  re-run DPO and CHiP under matched data; AMBER CHAIR falls 7.8->4.2,
  8.3->3.1, 5.9->2.9, with coverage rising and VQA-v2/TextVQA matched or
  improved. Ablations separate the intra-modal stage from the alignment stage.
  Not isolated: no ablation against a data-matched plain SFT baseline, and
  some comparison rows are literature-reported rather than controlled."
