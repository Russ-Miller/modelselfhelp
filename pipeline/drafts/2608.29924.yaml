statement: In 7-8B vision-language models, fine-tuning visual and text
  embeddings toward perturbation-averaged and ground-truth anchors before
  cross-modal contrastive alignment lowers object and attribute hallucination
  rates on captioning and existence benchmarks without reducing object
  coverage or general VQA accuracy.
kind: observation
backing_strength: single-paper
scope_condition: Single-image, single-turn settings at 7-8B scale (LLaVA-1.5,
  LLaVA-1.6, Qwen3-VL-8B); 2K training pairs drawn from RLHF-V chosen/rejected
  responses; evaluated on AMBER, ObjHal, MMHal, HallusionBench, POPE.
technique: ""
proposed_technique: Perturbation-invariance fine-tuning for vision-language embeddings
stance_on_existing: neither
related_claim_id: ""
