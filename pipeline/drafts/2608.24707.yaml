statement: "In synthetic hallucination benchmarks where faithful items are
  human-written and hallucinated items are LLM-rewrites, a detector's binary
  score partly measures human-vs-machine style rather than factuality: feeding
  faithful LLM rewrites of the same truthful articles makes some fine-tuned
  encoders flag nearly all of them as hallucinated."
kind: mechanism
backing_strength: single-paper
scope_condition: Fine-tuned multilingual encoders (ReMBERT, mDeBERTa) trained
  on an LLM-generated news hallucination corpus; provenance analysis run on
  Russian original text only.
