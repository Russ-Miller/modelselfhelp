falsifier: Detectors trained on such synthetic splits show near-baseline flag
  rates on faithful LLM rewrites of truthful articles, i.e. their scores track
  veracity independently of text provenance.
evidence_note: Measured on 290 truthful human articles, 290 factcheck.kz
  human-written fakes, 290 faithful Gemini rewrites, and synthetic
  hallucinations. ReMBERT flagged 0.352 of human truthful vs 1.000 of faithful
  LLM rewrites; mDeBERTa 0.221 vs 0.586, so the effect is real but
  model-dependent. Single language, single domain, two encoders; register
  differences between real fakes and newswire are acknowledged but not fully
  controlled.
