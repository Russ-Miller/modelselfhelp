statement: When a multimodal model is asked an object-existence question over
  a set of images at once, it is less accurate than when the same images are
  queried one at a time and the answers combined, so cross-image integration
  adds errors beyond the per-image perception errors.
kind: mechanism
backing_strength: single-paper
scope_condition: Object-centric questions (existence, counting, attribute,
  position) over sets of 2-10 natural images; shown for existence in a
  controlled decomposition ablation across 29 MLLMs including GPT-5 and
  Gemini-2.5-Pro.
technique: ""
proposed_technique: Decompose multi-image questions into per-image queries
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A model whose accuracy on joint multi-image existence questions
  matches or exceeds the combined per-image decomposed queries on the same
  images.
evidence_note: Ablation on the existence task comparing comprehensive
  multi-image questions against per-image decomposed questions over identical
  content; the paper reports the single-image route wins consistently across
  all models and scales, but the gap size is only shown in a figure. Overall
  benchmark average was 36.1% across 29 models; accuracy fell as image count
  rose (existence 62.4% easy to 30.0% at larger image counts).
confidence: medium
