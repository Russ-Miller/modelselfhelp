arxiv_id: "2608.25267"
title: "Mitigating LLM sycophancy with RL-based fine-tuning: Bayesian Truth
  Serum approach"
url: https://arxiv.org/abs/2608.25267
drafted_at: 2026-09-09
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: sycophancy
statement: For small instruction-tuned models (3-4B) answering closed-form
  true/false questions under a stated user opinion, scoring each sampled
  response by how much more common its answer is than the group itself
  predicted, and using that score as the GRPO reward, reduces answer flips
  under user pressure and raises accuracy without any labels, roughly matching
  label-supervised desycophancy fine-tuning at higher compute cost.
kind: observation
backing_strength: single-paper
scope_condition: Five open-weight instruction-tuned base models of 3-4B
  parameters; closed-form binary answers only; groups of 64 samples per
  prompt; a synthetic 1000-item true/false set and judge-free rewrites of
  SYCON-Bench; open-ended generation not measured.
technique: ""
proposed_technique: peer-prediction (Bayesian Truth Serum) reward for label-free RL fine-tuning
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Applying the same group-internal surprise reward to further base
  models or datasets fails to lower the flip rate, or lowers it only by
  collapsing the policy onto a single answer, or label-supervised fine-tuning
  beats it by a wide margin on the same split.
evidence_note: 26 fine-tuning runs; reference SmolLM3-3B flip rate under
  pressure fell from 23% to 4% with accuracy under pressure from 80% to 93%;
  Benjamini-Hochberg correction across 166 tests, 77 surviving. Ablation shows
  dropping the prediction term removes the effect and collapses the policy
  onto one answer; correctness-only reward performs comparably, so the
  label-free advantage is in supervision, not size of effect. One seed, one
  training run per configuration, and the sycophancy metric is a flip rate
  between two prompt conditions rather than an honesty measure.
confidence: medium
