capability: hallucination
statement: When fine-tuning a base model on instruction data, removing from
  the training targets any factual claim the base model cannot consistently
  recall raises the supported-claim rate of later long-form generations, but
  the gain comes largely from a more conservative response policy — more
  refusals and fewer supported claims per answer — not from generating more
  correct facts at equal coverage.
kind: mechanism
backing_strength: single-paper
scope_condition: Shown on Qwen3-4B-Base and OLMo 3 7B fine-tuned on the small
  English first-turn OASST1 set, evaluated on entity-centric long-form
  factuality benchmarks (WildHalu, Biography) with automatic claim
  verification; teacher models did the claim probing and rewriting.
technique: ""
proposed_technique: Recall-consistency filtering of fine-tuning targets
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A run where recall-filtered targets raise supported-claim
  percentage while holding refusal count and number of supported claims per
  response equal to standard SFT would show the gain is not coverage-driven;
  conversely, showing no factuality gain at all when the share of known claims
  in targets is varied would falsify the mechanism.
evidence_note: Compared four knowledge-alignment methods against standard SFT
  under one training setup, plus an ablation varying only the share of known
  claims (100/50/0%) with prompt count and refusal count fixed, which is the
  part that isolates causality. Factuality metrics count refusals as fully
  supported, so the headline gain is partly definitional; the authors say so
  and report the falling supported-claim counts. Single dataset, small SFT
  corpus, automatic verifiers.
confidence: medium
