statement: General-purpose factuality verifiers (entailment-, consistency-,
  and RAG-trained) and zero-shot frontier LLM judges perform near chance at
  spotting unsupported claims in scientific peer reviews that must be checked
  against the full submitted paper, because they cannot separate
  paper-unsupported assertions from legitimate evaluative critique; small
  models fine-tuned on in-domain examples beat them by a wide margin.
kind: observation
backing_strength: single-paper
scope_condition: Peer reviews of ML conference papers (ICLR/NeurIPS on
  OpenReview) with synthetically injected hallucinations; detection at review
  and sentence level with BM25 or full-paper evidence.
technique: ""
proposed_technique: Taxonomy-driven hallucination injection for review verification benchmarks
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An off-the-shelf verifier or zero-shot frontier LLM reaching
  review-level MCC comparable to the in-domain fine-tuned models on this or a
  similar peer-review grounding benchmark.
evidence_note: Measured on 12K papers and 38K reviews; four specialized
  verifiers gave review-level MCC of at most 0.03, prompted LLMs including
  GPT-5.2 stayed at 0.15-0.25 review-level MCC, while a fine-tuned Qwen2.5-3B
  reached 0.69 and Qwen3-32B 0.81. Hallucinations are LLM-injected rather than
  naturally occurring, so difficulty may reflect the injection distribution; a
  small authentic-review check (20 annotated cases) showed the fine-tuned
  detector recovered all of them at 22% false positive rate.
confidence: medium
