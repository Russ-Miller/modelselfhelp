capability: hallucination
statement: "On code prompts that are unsatisfiable by design, open-weight code
  and reasoning models refuse based on how suspicious the request looks rather
  than how deeply impossible it is: they refuse famous theoretical
  impossibilities far more often than requests for plausible-sounding
  nonexistent packages, and the stronger models in the set close the gap on
  theory while barely improving on fabricated ecosystem entities."
kind: observation
backing_strength: single-paper
scope_condition: Twelve open-weight code/reasoning models (7B-32B), 270
  adversarial unsatisfiable prompts across six languages plus 91 matched
  solvable controls, temperature 0, graded by a two-tier judge validated
  against 138 human labels.
technique: ""
proposed_technique: Unsatisfiable-task refusal benchmark with matched solvable controls
