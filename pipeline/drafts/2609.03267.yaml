falsifier: A model set where refusal rates on plausible fabricated package
  prompts equal or exceed those on abstract theoretical-impossibility prompts,
  or where higher-capability models improve on both classes at similar rates.
evidence_note: "Measured: aggregate hallucination rate 0.60 and refusal 0.27
  on adversarial prompts, 0% over-refusal on controls. Subcategory gradient
  from 0.98 (nonexistent npm) down to 0.08 (modified classics). Top-4 vs
  bottom-4 models: theory subcategories 0.23 vs 0.82, plausible-entity 0.87 vs
  0.98. Prompt identity explained more outcome variance than model identity.
  Only open-weight models tested; no frontier commercial models, so the
  capability trend is extrapolated within a narrow band. Framing and
  per-ecosystem comparisons are observational, not fully crossed."
