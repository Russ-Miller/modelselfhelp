arxiv_id: "2609.00455"
title: Towards a Belief-Based World Model for LLM Agents
url: https://arxiv.org/abs/2609.00455
drafted_at: 2026-09-09
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: state-tracking
statement: In partially observable text environments (ALFWorld, ScienceWorld),
  letting an LLM agent query an externally maintained state estimate that
  keeps an explicit distribution over unobserved object locations raises task
  success more than querying a deterministic memory of what has already been
  observed, and the gain shrinks to near zero on a frontier model that already
  nearly saturates the benchmark.
kind: observation
backing_strength: single-paper
scope_condition: Text-based household/science task environments where the only
  uncertainty is object location and the state space, prior and update rule
  are hand-specified; agents run under ReAct and ReflAct scaffolds; models
  Llama-3.1-8B-Instruct, Qwen3-14B, Sonnet 4.6.
technique: ""
proposed_technique: Expose a maintained belief distribution to the agent as a queryable interface
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An evaluation where the memory-only variant (observed locations,
  generic 'not yet observed' reply) matches the belief variant's success rate
  on the same tasks and models, or where belief access gives no gain over the
  base agent for small open models.
evidence_note: Measured success rate and steps on unseen splits of two text
  benchmarks, three models x two agent scaffolds, three runs (one for Sonnet).
  Belief-only beat base agent and beat a memory-only ablation on ALFWorld for
  Llama and Qwen; Sonnet showed little or no performance change. Belief
  accuracy is hand-engineered from the game engine's own priors, so the result
  isolates the value of the interface, not whether such a belief can be
  learned.
confidence: medium
