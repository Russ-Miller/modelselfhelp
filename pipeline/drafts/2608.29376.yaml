status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: evaluation-validity
statement: When comparing a weight-shared recursive model against a
  depth-matched plain transformer on code generation, the ranking read from a
  single checkpoint can invert during training, because the larger-parameter
  arm passes its validation optimum and overfits while the parameter-lean
  recursive arm keeps improving — so a late-epoch "recursion fits better"
  reading is a degradation artifact, not a capability difference.
kind: mechanism
backing_strength: single-paper
scope_condition: ~28M-parameter models, instruction-to-Python corpus of ~38k
  training records, many passes over a fixed corpus (data-constrained
  repeated-data regime), 40-epoch budget, three seeds; the parameter-lean arms
  are still improving at the budget boundary so their optima are
  right-censored.
technique: ""
proposed_technique: Trajectory-wide evaluation with per-arm validation-optimum
  checkpoint selection
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Tracking the same matched arms across training on other corpora or
  scales and finding the fit ranking stable across all checkpoints, so a
  single arbitrary checkpoint reproduces the validation-optimum ordering.
evidence_note: "Measured: three arms (recursive 20-effective-depth shared
  2-layer block, iso-parameter 2-layer, iso-depth 20-layer) trained 40 epochs,
  3 seeds, snapshots at 9 epochs. Fit ranking between recursive and iso-depth
  arms reversed at epochs 8 and 40; iso-depth validation loss bottomed at
  epoch 20 (1.15) and rose to 1.45 by epoch 40 while training loss fell.
  Cross-seed spread tight. Only one architecture family, one synthetic corpus,
  no execution-based correctness metric; recursion is not ablated from deep
  supervision, so the mechanism attribution to overfitting rests on the
  train-validation gap (1.04 for iso-depth vs 0.13 recursive) rather than a
  controlled intervention."
confidence: medium
