falsifier: A fine-tuned generative VLM whose own token probabilities match or
  beat a dedicated regression-head tagger on calibration correlation, or a
  fusion that fails to improve on both subsystems on a held-out split.
evidence_note: "Measured on the English validation split (N=379): tagger
  Pearson 0.369 vs generative 0.285; generative hallucinated IoU 0.182 vs
  tagger 0.155; fusion 0.413 Pearson and 0.391 IoU. Ablation shows removing
  the MSE calibration loss costs the most (-0.095 Pearson). Single task,
  single team, fusion weights tuned on the same validation split used to
  report the main number; hallucinated-span IoU stays low (0.196) throughout."
