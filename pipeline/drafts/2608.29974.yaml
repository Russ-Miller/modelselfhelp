capability: hallucination
statement: "For detecting hallucinated text spans in vision-language model
  outputs, span localization and confidence calibration come from different
  architectures: a fine-tuned generative VLM proposes better span boundaries
  but scores them poorly, while a discriminative token tagger trained with a
  direct regression loss on human-consensus confidence gives better-correlated
  probabilities but conservative spans, so using the generative spans as
  proposals and the tagger's probabilities as scores beats either alone."
kind: mechanism
backing_strength: single-paper
scope_condition: Character-level hallucination span detection on the
  SHROOM-Visions dataset (EN, FR, IT, ZH), responses under 512 tokens; tuning
  done on the English split.
technique: ""
proposed_technique: union-calibrated fusion of a generative span proposer with
  a calibrated tagger
