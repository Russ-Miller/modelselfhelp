arxiv_id: "2608.29092"
title: "EviAnchor: Mitigating Hallucinations in Large Vision-Language Models
  via Regional Visual Evidence Compensation"
url: https://arxiv.org/abs/2608.29092
drafted_at: 2026-09-09
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: For training-free inference-time hallucination interventions in
  7B-class vision-language models, increasing intervention strength (finer
  regional evidence partitioning, longer attention-routing windows, stronger
  textual perturbation) keeps lowering CHAIR object-hallucination scores while
  producing empty or reduced-coverage responses, so lower hallucination
  numbers at high intervention strength partly reflect the model saying less
  rather than grounding better.
kind: observation
backing_strength: single-paper
scope_condition: LLaVA-1.5-7B, InstructBLIP-Vicuna-7B and Qwen3-VL-4B with a
  training-free decoding-time intervention, measured on POPE, CHAIR and
  MMHal-Bench with object recall and response length reported alongside.
technique: ""
proposed_technique: Regional visual evidence anchoring with
  decision-conditioned attention routing
stance_on_existing: supports
related_claim_id: training-free-inference-time-hallucination-mitigation-7b-vision-language-models-reported-gains
stance_reason: The paper's own ablation shows 16- and 25-slot configurations
  reach lower CHAIRi while producing 8 and 25 empty responses and recall
  dropping from 77.38 to 71.48 and 54.98, and the authors say the lower
  hallucination scores are partly due to reduced output coverage.
falsifier: An ablation sweeping intervention strength on the same backbones
  and benchmarks in which hallucination metrics fall while object recall and
  response length hold constant at every strength setting.
evidence_note: Ablation on LLaVA-1.5-7B over REA slot counts 1/4/9/16/25 and
  routing lengths 4-12 layers, with recall, response length and empty-response
  counts reported. Main tables also report recall and length, and at the
  chosen 3x3 setting recall is preserved, so the confound is a property of the
  strength dial, not of the method at default. Single paper, no independent
  replication.
confidence: medium
