capability: long-term-memory
statement: When the preference needed to answer a query lies in a different
  concept space from the cues in a user's dialogue history (e.g. inferring an
  emotion-regulation strategy from personality cues), retrieval-based and
  profile-summarization personalization methods barely beat a no-history
  baseline, and dumping the full history into the prompt does worse than no
  history at all.
kind: observation
backing_strength: single-paper
scope_condition: Synthetic multi-session English dialogue profiles built
  around Big Five / RIASEC psychology mappings; six instruction-tuned open
  models, BM25 and BERTScore retrieval, profile-augmented prompting, and LoRA
  fine-tuning.
technique: retrieval-augmented-generation
proposed_technique: ""
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On the same benchmark, retrieval-augmented or full-history
  prompting reaching strategy-selection accuracy well above the no-history
  baseline without concept supervision.
evidence_note: Measured on a 128-item manually verified gold test set from a
  3,504-persona synthetic benchmark; strategy accuracy ~21.5 for no-history
  baseline, 18.4 for full-history prompting, 24.2 for profile-augmented
  prompting. Ablations with injected explicit preferences reach 100% for
  fine-tuned models, and template chain-of-thought over the known concept
  mapping lifts Task 1 accuracy by a reported 44%, isolating cross-concept
  mapping as the bottleneck. All histories are LLM-generated, so transfer to
  real user logs is untested.
