stance_reason: ""
falsifier: Running the same controlled position swap on a broader set of
  models and finding pass rate flat across branch positions, or higher for
  later positions.
evidence_note: "Controlled ablation on one subset of a new 1.5K-sample
  benchmark: same conditions, correct branch moved to position 1, 2 or 3,
  seven representative models. Drops are large for some (one model from 70.6
  to 29.4) and one model does not follow the pattern. Single benchmark, single
  video-instruction format; no test of whether the bias is representational or
  decoding-level."
