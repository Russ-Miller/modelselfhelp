statement: When a video-understanding instruction contains several conditional
  branches and the model must pick the branch matching what the video shows,
  both proprietary and open multimodal models pick correctly far more often
  when the correct branch is listed first, and accuracy falls as the correct
  branch moves later in the list.
kind: observation
backing_strength: single-paper
scope_condition: Multimodal LLMs given video plus a selection-style
  instruction with three conditions plus an else branch; measured as task pass
  rate with the branch set held fixed and only the correct branch's position
  moved.
technique: ""
