arxiv_id: "2609.02731"
title: "RVSD: Retrieval Vision Sparse Decoding for Mitigating Visual
  Hallucinations in Large Vision-Language Models"
url: https://arxiv.org/abs/2609.02731
drafted_at: 2026-09-09
